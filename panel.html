<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 0; background-color: #fff; user-select: none; }
        
        /* Fixed Header */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; background: #f3f3f3; border-bottom: 1px solid #ccc;
            position: sticky; top: 0; z-index: 100;
        }

        .status-info { display: flex; align-items: center; font-size: 11px; color: #666; font-family: sans-serif; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; margin-right: 8px; }
        .dot.connected { background: #2ecc71; box-shadow: 0 0 5px #2ecc71; }

        /* Tree Styles */
        .tree-container { font-family: 'Segoe UI', 'Consolas', monospace; padding: 10px; font-size: 12px; color: #333; }
        
        .tree-level { 
            margin-left: 10px; 
            padding-left: 10px;
            border-left: 1px solid #ddd; /* Vertical tracking line */
            display: block; 
        }

        .collapsed { display: none !important; }

        .tree-row { display: flex; align-items: center; padding: 2px 8px; border-radius: 4px; position: relative; white-space: nowrap; }
        .tree-row:hover { background-color: #f0f7ff; }

        /* Fold Toggle Arrow */
        .toggle {
            cursor: pointer; width: 14px; height: 14px;
            display: inline-flex; align-items: center; justify-content: center;
            margin-right: 4px; color: #666; transition: transform 0.2s;
        }
        .toggle.rotated { transform: rotate(-90deg); }

        .key { color: #881391; font-weight: bold; margin-right: 5px; }
        .value { color: #1a1aa6; }

        /* UI Buttons */
        .btn { cursor: pointer; font-size: 10px; padding: 2px 8px; border: 1px solid #ccc; background: #fff; border-radius: 3px; }
        .btn:hover { background: #e2e2e2; }
    </style>
</head>
<body>

<div class="header">
    <div class="status-info">
        <div id="status-dot" class="dot"></div>
        <span id="status-text">Detecting Framework...</span>
    </div>
    <button id="refreshBtn" class="btn">Manual Refresh</button>
</div>

<div id="editor" class="tree-container"></div>

<script type="module" src="panel.js"></script>
</body>
</html>
